<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timetable">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://yririhzvgwaywnaufebz.supabase.co https://www.omdbapi.com; img-src 'self' data: https: http:; font-src 'self' data:;">
<title>Timetable</title>
<link rel="manifest" id="manifest-link">
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --text2: #888580; --text3: #555250;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 14px; --radius-sm: 9px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'SF Pro Display', -apple-system, 'Helvetica Neue', sans-serif; overscroll-behavior: none; }
  .app { display: flex; flex-direction: column; height: 100%; width: 100%; }
  .header { padding: calc(var(--safe-top) + 16px) 20px 0; flex-shrink: 0; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .header-date { font-size: 13px; color: var(--text2); margin-top: 1px; }
  .add-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--text); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--bg); font-size: 22px; font-weight: 300; line-height: 1; transition: transform .15s, opacity .15s; flex-shrink: 0; }
  .add-btn:active { transform: scale(0.92); opacity: 0.8; }
  .day-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .day-scroll::-webkit-scrollbar { display: none; }
  .day-pill { flex-shrink: 0; padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 500; background: var(--surface); color: var(--text2); border: 0.5px solid var(--border); cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; white-space: nowrap; -webkit-user-select: none; user-select: none; }
  .day-pill.active { background: var(--text); color: var(--bg); border-color: transparent; font-weight: 600; }
  .day-pill .cnt { font-size: 10px; font-weight: 600; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.15); }
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--safe-bottom) + 24px); scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .events-list { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .event-card { display: flex; align-items: stretch; background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); overflow: hidden; transition: transform .12s; }
  .event-card:active { transform: scale(0.98); }
  .event-card.is-cancelled { opacity: 0.55; }
  .event-card.is-cancelled .event-name { text-decoration: line-through; text-decoration-color: var(--text3); }
  .event-card.is-cancelled .event-time { text-decoration: line-through; text-decoration-color: var(--text3); }
  .cancelled-badge { display: inline-block; margin-left: 8px; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: var(--surface2); border: 0.5px solid var(--border2); color: var(--text3); vertical-align: middle; text-decoration: none; letter-spacing: 0.04em; text-transform: uppercase; }
  .drag-handle { display: flex; align-items: center; justify-content: center; padding: 0 10px 0 12px; color: var(--text3); cursor: grab; flex-shrink: 0; touch-action: none; }
  .drag-handle:active { cursor: grabbing; }
  .event-card.drag-over { border-color: var(--text2); background: var(--surface2); }
  .event-stripe { width: 4px; flex-shrink: 0; }
  .event-main { flex: 1; padding: 12px 14px; min-width: 0; cursor: pointer; }
  .event-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event-time { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .event-loc { font-size: 11px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .event-del { padding: 0 16px; background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; display: flex; align-items: center; transition: color .15s; flex-shrink: 0; }
  .event-del:active { color: #e05555; }
  .empty-state { padding: 60px 20px; text-align: center; color: var(--text3); font-size: 14px; line-height: 1.6; }
  .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.2; }
  .status-bar { text-align: center; font-size: 11px; color: var(--text3); padding: 6px 16px 0; flex-shrink: 0; min-height: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-sheet { background: var(--surface); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 0 20px calc(var(--safe-bottom) + 28px); border-top: 0.5px solid var(--border2); animation: slideUp .28s cubic-bezier(0.32,0.72,0,1); }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .sheet-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 20px; }
  .sheet-title { font-size: 17px; font-weight: 600; margin-bottom: 20px; }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 11px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: block; }
  .field-input { width: 100%; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 15px; padding: 11px 13px; font-family: inherit; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .15s; }
  .field-input:focus { border-color: var(--border2); }
  .field-input::placeholder { color: var(--text3); }
  select.field-input { cursor: pointer; }
  option { background: #1a1a1a; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform .12s, border-color .12s; }
  .color-swatch.selected { border-color: var(--text); transform: scale(1.15); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 14px; border-radius: var(--radius-sm); background: var(--surface2); border: 0.5px solid var(--border); color: var(--text2); font-size: 15px; font-family: inherit; cursor: pointer; }
  .btn-save { flex: 2; padding: 14px; border-radius: var(--radius-sm); background: var(--text); border: none; color: var(--bg); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: opacity .15s; }
  .btn-save:disabled { opacity: 0.4; }
  .install-banner { margin: 0 16px 10px; padding: 12px 14px; background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; gap: 10px; }
  .install-banner p { font-size: 12px; color: var(--text2); flex: 1; line-height: 1.4; }
  .install-banner p strong { color: var(--text); font-weight: 600; }
  .install-btn { padding: 7px 12px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .install-close { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 0 0 0 4px; line-height: 1; }
  @media (min-width: 481px) { .modal-sheet { border-radius: 24px; margin-bottom: 40px; } .modal-overlay { align-items: center; } }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f3ef; --surface: #ffffff; --surface2: #f0ede8; --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15); --text: #1a1816; --text2: #706c66; --text3: #aaa89f; }
    select.field-input option { background: #fff; }
    .add-btn { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div><div class="header-title">Timetable</div><div class="header-date" id="header-date"></div></div>
      <button class="add-btn" onclick="openAdd()" aria-label="Add event">+</button>
    </div>
    <div class="day-scroll" id="day-tabs"></div>
  </div>
  <div id="install-area"></div>
  <div class="status-bar" id="status-bar">
    <span id="sync-indicator" style="display:none"><span class="sync-dot"></span>syncing</span>
    <span id="status-text"></span>
  </div>
  <div class="content"><div class="events-list" id="events-list"></div></div>
</div>

<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">New event</div>
    <div class="field-group"><label class="field-label">Event name</label><input class="field-input" id="f-name" type="text" placeholder="e.g. Team standup" autocomplete="off"></div>
    <div class="field-group"><label class="field-label">Day</label><select class="field-input" id="f-day"></select></div>
    <div class="field-row">
      <div class="field-group"><label class="field-label">Start</label><input class="field-input" id="f-start" type="time"></div>
      <div class="field-group"><label class="field-label">End</label><input class="field-input" id="f-end" type="time"></div>
    </div>
    <div class="field-group"><label class="field-label">Location (optional)</label><input class="field-input" id="f-loc" type="text" placeholder="e.g. Room 3B" autocomplete="off"></div>
    <div class="field-group"><label class="field-label">Color</label><div class="color-picker" id="color-picker"></div></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="save-btn" onclick="saveEvent()">Save event</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://yririhzvgwaywnaufebz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyaXJpaHp2Z3dheXduYXVmZWJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NzcxNTUsImV4cCI6MjA5NDM1MzE1NX0.gLPRT8z8yBMVtJqYh-d4UNRdAVkuiSHiGsmntgeTogM';
const TABLE = 'schedule';
const SB_HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

async function sbFetch(method, path, body) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { method, headers: SB_HEADERS, body: body ? JSON.stringify(body) : undefined });
  console.log('sbFetch', method, path, '->', res.status);
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || err.hint || 'HTTP ' + res.status); }
  return res.status === 204 ? null : res.json();
}

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const COLORS = { purple:'#7F77DD', teal:'#1D9E75', amber:'#EF9F27', coral:'#D85A30', pink:'#D4537E', blue:'#378ADD', green:'#639922' };
const CACHE_KEY = 'tt_cache_v2';
let records = [], activeDay = DAYS[new Date().getDay()===0?4:Math.min(new Date().getDay()-1,4)], selectedColor = '', deferredPrompt = null;

const manifest = { name:'Weekly Timetable', short_name:'Timetable', start_url:'./', display:'standalone', background_color:'#0f0f0f', theme_color:'#0f0f0f', icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%230f0f0f'/%3E%3Crect x='44' y='56' width='104' height='80' rx='10' fill='none' stroke='%23f0ede8' stroke-width='8'/%3E%3Crect x='44' y='56' width='104' height='26' rx='10' fill='%23f0ede8'/%3E%3Crect x='60' y='102' width='28' height='6' rx='3' fill='%23f0ede8'/%3E%3Crect x='60' y='116' width='48' height='6' rx='3' fill='%23f0ede8' opacity='.5'/%3E%3C/svg%3E",sizes:'192x192',type:'image/svg+xml'}] };
document.getElementById('manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt=e; showInstallBanner('pwa'); });
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIos && !isStandalone) setTimeout(()=>showInstallBanner('ios'),2000);
function showInstallBanner(type) {
  const a = document.getElementById('install-area');
  a.innerHTML = type==='pwa'
    ? '<div class="install-banner"><p><strong>Add to home screen</strong><br>Install for quick access</p><button class="install-btn" onclick="triggerInstall()">Install</button><button class="install-close" onclick="this.closest(\'.install-banner\').remove()">x</button></div>'
    : '<div class="install-banner"><p><strong>Add to home screen</strong><br>Tap share then Add to Home Screen</p><button class="install-close" onclick="this.closest(\'.install-banner\').remove()">x</button></div>';
}
async function triggerInstall() { if(!deferredPrompt)return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('install-area').innerHTML=''; }

document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
const daySelect = document.getElementById('f-day');
DAYS.forEach(d => { const o=document.createElement('option'); o.value=d; o.textContent=d; if(d===activeDay)o.selected=true; daySelect.appendChild(o); });
const cp = document.getElementById('color-picker');
Object.entries(COLORS).forEach(([name,hex]) => { const sw=document.createElement('button'); sw.className='color-swatch'; sw.style.background=hex; sw.title=name; sw.onclick=()=>{ selectedColor=name; document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected')); sw.classList.add('selected'); }; cp.appendChild(sw); });

function showSync() { document.getElementById('sync-indicator').style.display='inline-flex'; document.getElementById('status-text').textContent=''; }
function hideSync(msg) { document.getElementById('sync-indicator').style.display='none'; document.getElementById('status-text').textContent=msg||''; }
function setStatus(msg) { document.getElementById('status-text').textContent=msg; }

function loadFromCache() { try { const raw=localStorage.getItem(CACHE_KEY); if(!raw)return false; records=JSON.parse(raw); renderTabs(); renderEvents(); return true; } catch(e){return false;} }
function saveToCache(r) { try{localStorage.setItem(CACHE_KEY,JSON.stringify(r));}catch(e){} }
function getSortOrder(day) { try{return JSON.parse(localStorage.getItem('sort_'+day)||'[]');}catch(e){return[];} }
function saveSortOrder(day,ids) { localStorage.setItem('sort_'+day,JSON.stringify(ids)); }

function sortedEvents(day) {
  const evs = records.filter(r=>r.day===day);
  const order = getSortOrder(day).map(String);
  if(!order.length) return evs.sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const ordered = order.map(id=>evs.find(e=>String(e.id)===id)).filter(Boolean);
  const unordered = evs.filter(e=>!order.includes(String(e.id))).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  return [...ordered,...unordered];
}

async function loadEvents(silent) {
  if(!silent){ const c=loadFromCache(); if(!c) setStatus('Loading...'); }
  showSync();
  try {
    const data = await sbFetch('GET', TABLE+'?order=sort_order.asc,start_time.asc');
    records = data.map(r=>({ id:r.id, name:r.event_name||'', day:r.day||'', start:r.start_time||'', end:r.end_time||'', loc:r.location||'', color:r.color||'', cancelled:r.cancelled||false }));
    saveToCache(records);
    hideSync(records.length ? records.length+' event'+(records.length!==1?'s':'') : '');
    renderTabs(); renderEvents();
  } catch(e) { hideSync(''); if(!silent)setStatus('Could not load'); console.error('Load error:',e); }
}

function renderTabs() {
  document.getElementById('day-tabs').innerHTML = DAYS.map(d => {
    const n = records.filter(r=>r.day===d).length;
    return '<button class="day-pill'+(d===activeDay?' active':'')+'" onclick="setDay(\''+d+'\')">'+d.slice(0,3)+(n?'<span class="cnt">'+n+'</span>':'')+'</button>';
  }).join('');
}
function setDay(d) { activeDay=d; document.getElementById('f-day').value=d; renderTabs(); renderEvents(); }
function fmtTime(t) { if(!t)return'?'; const[h,m]=t.split(':').map(Number); if(isNaN(h))return t; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function renderEvents() {
  const el = document.getElementById('events-list');
  const evs = sortedEvents(activeDay);
  if(!evs.length){ el.innerHTML='<div class="empty-state"><div class="empty-icon">O</div>No events on '+activeDay+'<br><span style="font-size:12px;display:block;margin-top:4px">Tap + to add one</span></div>'; return; }
  el.innerHTML = evs.map(ev => {
    const hex = COLORS[(ev.color||'').toLowerCase()]||'#555250';
    const cc = ev.cancelled?' is-cancelled':'';
    const badge = ev.cancelled?'<span class="cancelled-badge">Cancelled</span>':'';
    const loc = ev.loc?'<div class="event-loc">'+ev.loc+'</div>':'';
    return '<div class="event-card'+cc+'" draggable="true" data-id="'+ev.id+'" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondragend="dragEnd(event)" ondrop="dragDrop(event)" ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">'
      +'<div class="drag-handle" aria-label="Drag to reorder"><svg width="12" height="16" viewBox="0 0 12 16" fill="none"><circle cx="4" cy="4" r="1.5" fill="currentColor" opacity=".4"/><circle cx="8" cy="4" r="1.5" fill="currentColor" opacity=".4"/><circle cx="4" cy="8" r="1.5" fill="currentColor" opacity=".4"/><circle cx="8" cy="8" r="1.5" fill="currentColor" opacity=".4"/><circle cx="4" cy="12" r="1.5" fill="currentColor" opacity=".4"/><circle cx="8" cy="12" r="1.5" fill="currentColor" opacity=".4"/></svg></div>'
      +'<div class="event-stripe" style="background:'+(ev.cancelled?'var(--text3)':hex)+'"></div>'
      +'<div class="event-main" onclick="toggleCancelled(\''+ev.id+'\',event)" ontouchend="handleCardTap(\''+ev.id+'\',event)"><div class="event-name">'+ev.name+badge+'</div><div class="event-time">'+fmtTime(ev.start)+' - '+fmtTime(ev.end)+'</div>'+loc+'</div>'
      +'<button class="event-del" onclick="deleteEvent(\''+ev.id+'\',event)" aria-label="Delete">x</button></div>';
  }).join('');
}

function handleCardTap(id, e) {
  if (touchDragId) return;
  e.preventDefault();
  toggleCancelled(id, e);
}
  
async function toggleCancelled(id, e) {
  e.stopPropagation();
  const rec = records.find(r=>String(r.id)===String(id));
  if(!rec) return;
  const current = rec.cancelled, newVal = !current;
  rec.cancelled = newVal; renderEvents();
  try { await sbFetch('PATCH', TABLE+'?id=eq.'+id, {cancelled:newVal}); saveToCache(records); }
  catch(err) { rec.cancelled=current; renderEvents(); setStatus('Update failed: '+err.message); }
}

function openAdd() {
  ['f-name','f-loc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-day').value=activeDay;
  document.getElementById('f-start').value=''; document.getElementById('f-end').value='';
  selectedColor=''; document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
  document.getElementById('save-btn').disabled=false;
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('f-name').focus(),300);
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function handleOverlayClick(e) { if(e.target===document.getElementById('modal'))closeModal(); }

async function saveEvent() {
  const name=document.getElementById('f-name').value.trim(), day=document.getElementById('f-day').value;
  const start=document.getElementById('f-start').value, end=document.getElementById('f-end').value;
  const loc=document.getElementById('f-loc').value.trim();
  if(!name||!day||!start||!end){alert('Please fill in name, day, start and end time.');return;}
  document.getElementById('save-btn').disabled=true; setStatus('Saving...');
  try {
    await sbFetch('POST', TABLE, { event_name:name, day, start_time:start, end_time:end, location:loc||null, color:selectedColor||null, cancelled:false, sort_order:records.filter(r=>r.day===day).length+1 });
    closeModal(); await loadEvents();
  } catch(e) { setStatus('Save failed: '+e.message); document.getElementById('save-btn').disabled=false; }
}

async function deleteEvent(id, e) {
  e.stopPropagation();
  if(!confirm('Remove this event?'))return;
  setStatus('Removing...');
  try { await sbFetch('DELETE', TABLE+'?id=eq.'+id); await loadEvents(); }
  catch(e) { setStatus('Delete failed'); }
}

let dragSrcId=null;
function dragStart(e){dragSrcId=e.currentTarget.dataset.id;e.currentTarget.style.opacity='0.4';e.dataTransfer.effectAllowed='move';}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.event-card').forEach(c=>c.classList.remove('drag-over'));if(e.currentTarget.dataset.id!==dragSrcId)e.currentTarget.classList.add('drag-over');}
function dragDrop(e){e.preventDefault();const t=e.currentTarget.dataset.id;if(dragSrcId&&t&&dragSrcId!==t)reorder(dragSrcId,t);}
function dragEnd(e){e.currentTarget.style.opacity='';document.querySelectorAll('.event-card').forEach(c=>c.classList.remove('drag-over'));dragSrcId=null;}

let touchDragId=null,touchClone=null,touchOffsetY=0;
function touchStart(e){const card=e.currentTarget;if(!e.target.closest('.drag-handle'))return;e.preventDefault();touchDragId=card.dataset.id;const rect=card.getBoundingClientRect();touchOffsetY=e.touches[0].clientY-rect.top;touchClone=card.cloneNode(true);touchClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;opacity:0.85;z-index:999;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.4);';document.body.appendChild(touchClone);card.style.opacity='0.3';}
function touchMove(e){if(!touchDragId||!touchClone)return;e.preventDefault();const y=e.touches[0].clientY;touchClone.style.top=(y-touchOffsetY)+'px';document.querySelectorAll('.event-card').forEach(c=>c.classList.remove('drag-over'));const els=document.elementsFromPoint(e.touches[0].clientX,y);const t=els.find(el=>el.classList.contains('event-card')&&el.dataset.id!==touchDragId);if(t)t.classList.add('drag-over');}
function touchEnd(e){if(!touchDragId)return;const y=e.changedTouches[0].clientY;const els=document.elementsFromPoint(e.changedTouches[0].clientX,y);const t=els.find(el=>el.classList.contains('event-card')&&el.dataset.id!==touchDragId);if(t)reorder(touchDragId,t.dataset.id);if(touchClone){touchClone.remove();touchClone=null;}document.querySelectorAll('.event-card').forEach(c=>{c.style.opacity='';c.classList.remove('drag-over');});touchDragId=null;}

function reorder(srcId, targetId) {
  const evs = sortedEvents(activeDay);
  const ids = evs.map(e=>String(e.id));
  const from = ids.indexOf(String(srcId)), to = ids.indexOf(String(targetId));
  if(from===-1||to===-1) return;
  ids.splice(from,1);
  ids.splice(to,0,String(srcId));
  saveSortOrder(activeDay, ids);
  renderEvents();
}
  
loadEvents();
</script>
